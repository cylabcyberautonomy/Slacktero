services:
  translation-server:
    # Built from source (see translation-server.Dockerfile). The published
    # image is arm64-only, so on x86 we build; this also keeps translators
    # current. No manual pre-clone — compose fetches the source at build time.
    build:
      context: .
      dockerfile: docker/translation-server.Dockerfile
    restart: unless-stopped
    expose:
      - "1969"          # internal only; the bot reaches it over the compose network

  bot:
    build:
      context: .
      dockerfile: docker/bot.Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      - TRANSLATION_SERVER_URL=http://translation-server:1969
    volumes:
      - ./slacktero.toml:/app/slacktero.toml:rw
    depends_on:
      - translation-server
    # No ports published: Socket Mode connects outbound to Slack.
